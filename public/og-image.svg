<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="50%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#EDE6DA" />
    </linearGradient>
    <radialGradient id="sunbeam" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FCE8DD" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#sunbeam)" />

  <!-- Subtle grid border -->
  <rect x="40" y="40" width="1120" height="550" rx="32" fill="none" stroke="#18181B" stroke-opacity="0.08" stroke-width="2" />

  <!-- Badge -->
  <rect x="90" y="90" width="280" height="42" rx="21" fill="#F1ECE4" stroke="#18181B" stroke-opacity="0.08" stroke-width="1" />
  <circle cx="112" cy="111" r="5" fill="#C86A4B" />
  <text x="128" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#52525B" letter-spacing="1.5">THOUGHTFUL DIGITAL CRAFT</text>

  <!-- Main Headline -->
  <text x="90" y="220" font-family="'Syne', system-ui, sans-serif" font-size="64" font-weight="800" fill="#18181B" letter-spacing="-1.5">
    Websites Crafted With
  </text>
  <text x="90" y="295" font-family="'Playfair Display', Georgia, serif" font-size="64" font-style="italic" font-weight="600" fill="#C86A4B">
    Calm Precision
  </text>
  <text x="530" y="295" font-family="'Syne', system-ui, sans-serif" font-size="64" font-weight="800" fill="#18181B">
    &amp; Pure Flow.
  </text>

  <!-- Subtitle -->
  <text x="90" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#52525B">
    Piyush Verma — Full-Stack Web Craftsman &amp; UI/UX Developer
  </text>

  <!-- Tag Pills -->
  <g transform="translate(90, 440)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="46" rx="23" fill="#E2ECE4" />
    <text x="90" y="29" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#2D5A3C" text-anchor="middle">Next.js &amp; React</text>

    <!-- Pill 2 -->
    <rect x="195" y="0" width="170" height="46" rx="23" fill="#FCE8DD" />
    <text x="280" y="29" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#8C4A32" text-anchor="middle">Tactile UI/UX</text>

    <!-- Pill 3 -->
    <rect x="380" y="0" width="200" height="46" rx="23" fill="#EDE9F4" />
    <text x="480" y="29" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#534273" text-anchor="middle">Lighthouse 100</text>
  </g>

  <!-- Footer Branding -->
  <circle cx="1020" cy="510" r="36" fill="#18181B" />
  <text x="1020" y="522" font-family="'Syne', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FAF8F5" text-anchor="middle">P</text>
  <text x="965" y="520" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#71717A" text-anchor="end">github.com/piyushverma70</text>
</svg>
